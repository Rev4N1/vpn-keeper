name: build

# Every push and PR: compile and run the tests (including a full login against
# a fake Connect Tunnel), and keep the .exe as an artifact. A v* tag also
# publishes a release (v1.2.3-beta.1 and the like as a pre-release).
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe needs the tags

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Test

      - name: Version
        id: v
        shell: pwsh
        run: '"version=$((Get-Item dist/vpn-keeper.exe).VersionInfo.ProductVersion)" >> $env:GITHUB_OUTPUT'

      - uses: actions/upload-artifact@v4
        with:
          name: vpn-keeper-${{ steps.v.outputs.version }}
          path: dist/vpn-keeper.exe
          retention-days: 90

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_NAME -match '-') {
            gh release create $env:GITHUB_REF_NAME dist/vpn-keeper.exe --generate-notes --prerelease
          } else {
            gh release create $env:GITHUB_REF_NAME dist/vpn-keeper.exe --generate-notes
          }
